name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Checkout SRAM macro
        uses: actions/checkout@v6
        with:
          repository: RTimothyEdwards/gf180mcu_ocd_ip_sram
          ref: d41c7447d34d0c298158094378c8268560941724
          path: build/asic-memory/ocd
          persist-credentials: false

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttgf26c
        with:
          pdk: gf180mcuD

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttgf26c

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Checkout SRAM macro
        uses: actions/checkout@v6
        with:
          repository: RTimothyEdwards/gf180mcu_ocd_ip_sram
          ref: d41c7447d34d0c298158094378c8268560941724
          path: build/asic-memory/ocd
          persist-credentials: false

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttgf26c

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttgf26c
