name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Checkout SRAM macro
        uses: actions/checkout@v6
        with:
          repository: RTimothyEdwards/gf180mcu_ocd_ip_sram
          ref: d41c7447d34d0c298158094378c8268560941724
          path: build/asic-memory/ocd
          persist-credentials: false

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttgf26c
        with:
          pdk: gf180mcuD

      - name: Keep internal SRAM power straps out of the shuttle pin list
        run: python3 scripts/fix-sram-lef.py tt_submission/*.lef

      - name: Add artwork
        run: |
          python3 -m venv "$RUNNER_TEMP/artwork"
          "$RUNNER_TEMP/artwork/bin/pip" install gdstk==1.0.2 Pillow==13.0.0
          "$RUNNER_TEMP/artwork/bin/python" scripts/add-artwork.py tt_submission/tt_um_gatoware_prometheus_lite.gds

      # The Tiny Tapeout action renders its preview before the artwork is added.
      # Re-render the modified submission GDS and replace that stale artifact.
      - name: Render GDS preview with artwork
        env:
          GDS_PATH: tt_submission/tt_um_gatoware_prometheus_lite.gds
        run: |
          rm -f gds_render.png
          ./tt/tt_tool.py --create-png --pdk gf180mcuD
          test -s gds_render.png

      - name: Publish GDS preview with artwork
        uses: actions/upload-artifact@v7
        with:
          name: gds_render
          overwrite: true
          path: gds_render.png

      - name: Publish corrected submission
        uses: actions/upload-artifact@v7
        with:
          name: tt_submission
          overwrite: true
          path: |
            src/*
            docs/*
            tt_submission/*
            info.yaml
            LICENSE

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttgf26c

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Checkout SRAM macro
        uses: actions/checkout@v6
        with:
          repository: RTimothyEdwards/gf180mcu_ocd_ip_sram
          ref: d41c7447d34d0c298158094378c8268560941724
          path: build/asic-memory/ocd
          persist-credentials: false

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttgf26c

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttgf26c
