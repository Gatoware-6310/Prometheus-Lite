# Tiny Tapeout project information
project:
  title:        "Prometheus Lite"      # Project title
  author:       "Gatoware"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "An 8 bit, smaller version of the Prometheus CPU"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     15151515       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "3x4"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 3x4 or 4x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_gatoware_prometheus_lite"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "prometheus_lite.v"
    - "control_unit.v"
    - "instruction_register.v"
    - "memory.v"
    - "memory_asic.v"
    - "program_counter.v"
    - "register_file.v"
# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "Input port bit 0 (program byte during load)"
  ui[1]: "Input port bit 1 (program byte during load)"
  ui[2]: "Input port bit 2 (program byte during load)"
  ui[3]: "Input port bit 3 (program byte during load)"
  ui[4]: "Input port bit 4 (program byte during load)"
  ui[5]: "Input port bit 5 (program byte during load)"
  ui[6]: "Input port bit 6 (program byte during load)"
  ui[7]: "Input port bit 7 (program byte during load)"

  # Outputs
  uo[0]: "Output port bit 0"
  uo[1]: "Output port bit 1"
  uo[2]: "Output port bit 2"
  uo[3]: "Output port bit 3"
  uo[4]: "Output port bit 4"
  uo[5]: "Output port bit 5"
  uo[6]: "Output port bit 6"
  uo[7]: "Output port bit 7"

  # Bidirectional pins
  uio[0]: "Program load mode (holds CPU in reset)"
  uio[1]: "Write one byte per strobe pulse sampled by clk"
  uio[2]: "GPIO bit 2"
  uio[3]: "GPIO bit 3"
  uio[4]: "GPIO bit 4"
  uio[5]: "GPIO bit 5"
  uio[6]: "GPIO bit 6"
  uio[7]: "GPIO bit 7"


# Do not change!
yaml_version: 6
