# Tiny Tapeout project information
project:
  title:        "Prometheus Lite"      # Project title
  author:       "Gatoware"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "An 8 bit, smaller version of the Prometheus CPU"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     0       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 3x4 or 4x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_gatoware_prometheus_lite"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "prometheus_lite.v"
    - "control_unit.v"
    - "instruction_register.v"
    - "memory.v"
    - "program_counter.v"
    - "register_file.v"
# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "Memory read data bit 0"
  ui[1]: "Memory read data bit 1"
  ui[2]: "Memory read data bit 2"
  ui[3]: "Memory read data bit 3"
  ui[4]: "Memory read data bit 4"
  ui[5]: "Memory read data bit 5"
  ui[6]: "Memory read data bit 6"
  ui[7]: "Memory read data bit 7"

  # Outputs
  uo[0]: "Memory address bit 0"
  uo[1]: "Memory address bit 1"
  uo[2]: "Memory address bit 2"
  uo[3]: "Memory address bit 3"
  uo[4]: "Memory address bit 4"
  uo[5]: "Memory address bit 5"
  uo[6]: "Memory address bit 6"
  uo[7]: "Memory address bit 7"

  # Bidirectional pins
  uio[0]: "Memory write data bit 0"
  uio[1]: "Memory write data bit 1"
  uio[2]: "Memory write data bit 2"
  uio[3]: "Memory write data bit 3"
  uio[4]: "Memory write data bit 4"
  uio[5]: "Memory write data bit 5"
  uio[6]: "Memory write data bit 6"
  uio[7]: "Memory write data bit 7"


# Do not change!
yaml_version: 6
